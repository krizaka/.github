sonar.projectKey=krizaka_.github
sonar.organization=krizaka
sonar.sources=scripts,actions,deploy,tools,.github
sonar.tests=tests,scripts,actions
sonar.test.inclusions=tests/**,**/*.test.mjs
sonar.exclusions=**/node_modules/**,tests/**,**/*.test.mjs
# node:test writes this lcov (npm test, krizaka-internal#3553); the paths are repository-relative.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Not measured, with the reason: workflows and action manifests (yml) carry no JavaScript to cover; deploy/ and tools/ are separate
# packages with their own tooling, not run by `npm test`; the shell steps of actions are exercised by the workflows' self-test.
sonar.coverage.exclusions=**/*.yml,**/*.yaml,**/*.sh,deploy/**,tools/**
