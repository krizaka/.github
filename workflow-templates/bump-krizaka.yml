# A @krizaka release reaches this repository in minutes (krizaka/.github#388): the publisher sends `krizaka-release`, the
# shared workflow bumps the ranges and opens one auto-merged pull request. Run it by hand with « dry-run » to see the plan.
# The shared workflow bumps every package.json of the repository and regenerates every lockfile it changed (root and nested), each with its own manager: `pnpm-lock.yaml` runs pnpm, `package-lock.json` runs
# `npm install --package-lock-only`, neither is an error. A repository whose package is in a sub-folder (krizaka-java: `site`) adds
# `working-directory: <folder>` under `with:`.
# The `bump` job keeps `permissions: contents: read`: the called job asks for it, and without it the run is a startup_failure.
name: Bump @krizaka packages

on:
  repository_dispatch:
    types: [krizaka-release]
  workflow_dispatch:
    inputs:
      packages:
        description: 'The packages, {"@krizaka/ui":"3.74.0"}'
        required: true
      dry-run:
        type: boolean
        default: true

permissions: {}

jobs:
  bump:
    # The called job reads the repository (contents: read); a caller job that grants less is a startup_failure with 0 jobs (krizaka-internal#3342).
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/bump-krizaka.yml@a5c115f5a6a3760b537581a26850a02f52e0fa6b # main
    with:
      packages: ${{ github.event.client_payload.packages && toJSON(github.event.client_payload.packages) || inputs.packages }}
      dry-run: ${{ inputs.dry-run == true }}
      # working-directory: site # only when the package is not at the root; its lockfile decides pnpm or npm
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
