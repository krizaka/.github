# Tell the consumers of a @krizaka release (krizaka/.github#388). After `changeset publish`, the publisher (krizaka-ts,
# krizaka-ui) calls this with the packages it published; every repository of release-consumers.json that depends on one of
# them gets a repository_dispatch `krizaka-release`, which runs its bump-krizaka.yml workflow.
name: dispatch-release
description: Send a krizaka-release repository_dispatch to the repositories that depend on the published packages.
author: Krizaka

inputs:
  packages:
    description: 'What was published: {"@krizaka/ui":"3.74.0"} or the publishedPackages output of changesets/action.'
    required: true
  app-id:
    description: "The id of the krizaka-agents GitHub App (installed on the organisation)."
    required: true
  private-key:
    description: "The private key of that App."
    required: true
  dry-run:
    description: "List who would be told, send nothing."
    default: "false"

runs:
  using: composite
  steps:
    - id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: krizaka
        permission-contents: write # repository_dispatch needs it on the receiving repository
    - shell: bash
      run: node "${{ github.action_path }}/../../scripts/krizaka-release.mjs" dispatch "$PACKAGES" ${DRY_RUN:+--dry-run}
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PACKAGES: ${{ inputs.packages }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && 'true' || '' }}
