# The one gitleaks configuration of Krizaka (krizaka/.github#324, ADR-013). Every repository consumes THIS file: the
# reusable workflow `security-scan.yml` and the pre-commit hook `krizaka-gitleaks` both read it from here, never a copy.
# The default ruleset stays whole; an exception goes below with its reason, scoped as narrowly as possible.
title = "Krizaka gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Stripe-shaped key built to prove the legal-docs test refuses a secret-looking token (not a credential)"
condition = "AND"
paths = ['''tests/legal-docs\.test\.mjs''']
regexes = ['''sk_live_[A-Za-z0-9]+''']

# Test fixtures and CI-only dummies found by the first scan of the focus repositories (2026-10-27). Each is a path-scoped
# exception with its reason; a real credential is never allowlisted: it is rotated.
[[allowlists]]
description = "verikora: fake hash/token/password constants of the auth and redaction unit tests"
paths = ['''apps/web/lib/auth-compat\.test\.ts''', '''apps/web/lib/redact\.test\.ts''']

[[allowlists]]
description = "folioviv: CI-only build/e2e environment (the sibling secret is named ci-only-...), set after the build; production keys come from the deployment environment"
paths = ['''scripts/ci-after-build\.sh''']

[[allowlists]]
description = "krizaka-ui: synthetic QR payload, fake bearer token and fake keychain value in unit tests"
paths = ['''packages/ui/src/qr-code/encode\.test\.ts''', '''packages/app-client/test/react\.test\.tsx''', '''packages/app-desktop/test/storage-links\.test\.ts''']

[[allowlists]]
description = "krizaka-ts: fake API key of the video client unit test"
paths = ['''packages/video/test/video\.test\.ts''']

[[allowlists]]
description = "krizaka-composer: the Puck fork keeps the upstream history; one upstream commit documents a placeholder Contentful token in a README (not a credential)"
condition = "AND"
commits = ["d94428819a958b4f566e5d0e8cd29b3bf1107881"]
paths = ['''packages/field-contentful/README\.md''']

[[allowlists]]
description = "krizaka-java: the published test vector of the Standard Webhooks specification (secret and message id from the spec, not a credential); the file moved with krizaka-platform-kit → krizaka-service-kit (krizaka-internal#2665)"
paths = ['''krizaka-service-kit/krizaka-webhooks/src/test/java/com/krizaka/webhooks/WebhookSignatureTest\.java''']

[[allowlists]]
description = "sovkora (ADR-029): the Sovkora repositories are imported into krizaka/sovkora as one snapshot commit of their current state (founder, 2026-11-07; the histories live in the private bundles). It carries two of the four test fixtures each repository had reviewed as not credentials (2026-10-29): the PEM fixture of the engine's law-review test and a pack's example key. The other two are gone from the current state. Scoped to the snapshot commit and those two paths"
condition = "AND"
commits = ["ffc78892c048feb20bde660aaa806fc68ccc39a6"]
paths = ['''engine/sovkora-tools/src/test/java/com/krizaka/sovkora/tools/infrastructure/config/LawReviewConfigurationTest\.java''', '''packs/privacy-law25/pack\.yaml''']
