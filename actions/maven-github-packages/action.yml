# A development build resolves the Krizaka libraries just released from GitHub Packages (maven.pkg.github.com/krizaka/<repository>),
# where CI publishes them before the human release to Maven Central (the Central release stays a manual Publish; one cannot be
# deleted). The repositories and the credential go into the runner's ~/.m2/settings.xml (mode 0600, an ephemeral machine), never into a POM.
#
#   - uses: actions/setup-java@<sha>
#   - uses: krizaka/.github/actions/maven-github-packages@<sha>
#     with:
#       token: ${{ github.token }}      # the job needs `packages: read`
#
# Run it after actions/setup-java (it merges into the settings file setup-java wrote).
name: maven-github-packages
description: Adds the Krizaka GitHub Packages repositories (repositories, plugin repositories, read credential) to ~/.m2/settings.xml.
author: Krizaka

inputs:
  token:
    description: "A credential that reads packages (github.token with `packages: read`, or a PAT with read:packages)."
    required: true
  repositories:
    description: "Krizaka repositories whose GitHub Packages are searched (space-separated)."
    default: "krizaka-build"
  username:
    description: "The user the credential belongs to."
    default: ${{ github.actor }}

runs:
  using: composite
  steps:
    - name: Add the GitHub Packages repositories to the Maven settings
      shell: bash
      env:
        CREDENTIAL: ${{ inputs.token }}
        REPOSITORIES: ${{ inputs.repositories }}
        USERNAME: ${{ inputs.username }}
        SCRIPT: ${{ github.action_path }}/../../scripts/maven-github-packages-settings.mjs
      run: |
        echo "::add-mask::$CREDENTIAL"
        node "$SCRIPT" --settings "$HOME/.m2/settings.xml" --repositories "$REPOSITORIES" --username "$USERNAME"
