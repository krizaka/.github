# The one SonarCloud scanner step of the org (krizaka/.github#393, rule `no-inline-sonar`): a repository's workflow calls this
# action, never SonarSource's directly, so the scanner version and its pin move in one place. The caller checks out with
# `fetch-depth: 0` and has run the tests that write the coverage reports.
name: sonar-scan
description: SonarCloud analysis of a Krizaka repository, with the scanner pinned once for the whole organisation.
author: Krizaka

inputs:
  token:
    description: "The SONAR_TOKEN secret (the org secret). Never printed."
    required: true
  project-base-dir:
    description: "Directory the analysis runs from (its sonar-project.properties names sources and reports)."
    default: "."
  args:
    description: "Extra scanner arguments, e.g. -Dsonar.qualitygate.wait=true."
    default: ""
  host-url:
    description: "SonarQube host."
    default: https://sonarcloud.io

runs:
  using: composite
  steps:
    - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
      with:
        projectBaseDir: ${{ inputs.project-base-dir }}
        args: ${{ inputs.args }}
