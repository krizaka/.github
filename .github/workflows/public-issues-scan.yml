# Public issues that look internal (security lane, 2026-10-30): every day, and on every issue opened here, read the issues our
# apps opened in the org's public repositories and keep ONE tracking issue in krizaka/krizaka-internal listing the suspects.
# The CTO transfers them. The logs are public: the script prints counts only.
name: Public issues scan

on:
  schedule:
    - cron: "41 6 * * *"
  issues:
    types: [opened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-issues-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan public issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/scan-public-issues.test.mjs
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: krizaka-internal
          permission-issues: write
      - run: node scripts/scan-public-issues.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
