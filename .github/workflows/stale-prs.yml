# Stale PRs (krizaka/krizaka-internal#2000): older than 7 days -> branch updated (a new head, a full re-run before any train);
# idle for more than 21 days -> closed with a note (label `keep-open` opts out). scripts/stale-prs.mjs.
name: Stale PRs

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list what would change
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sweep:
    name: Stale PR sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka # zizmor: ignore[github-app] the sweep covers every repository of the org, by design
          permission-pull-requests: write
          permission-issues: write
          permission-contents: write
          permission-metadata: read
      - run: node scripts/stale-prs.mjs ${DRY_RUN:+--dry-run} # zizmor: ignore[github-app] pull requests write: update-branch and close
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || '' }}
