# Do the files of this pull request or push need the heavy jobs? (reusable; GitHub Actions minutes, krizaka/.github CI-COST)
#
# A repository's CI calls it first and gives every heavy job `needs: changes`:
#
#   jobs:
#     changes:
#       uses: krizaka/.github/.github/workflows/changes.yml@<sha>
#       with:
#         ignore: '^[^/]+\.md$|^docs/|^\.changeset/'      # JavaScript RegExp: files that never need the jobs
#     check:
#       name: Type-check, test, build                      # the required check keeps its name
#       needs: changes
#       if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
#
# A job skipped by its `if` reports « Skipped », which branch protection counts as passing: the required check
# stays satisfied on a docs-only pull request, for no minute. The wording of the `if` is the safety: the jobs run
# unless this workflow answered exactly `false`, so a failure here (API error, a cancelled job) runs everything.
# Nothing is ever skipped because the gate itself broke.
#
# `code` is `true` for anything that is not a pull request, a branch push or a merge-queue entry (schedule, dispatch,
# tag), for an empty or truncated file list, and when any changed file matches `relevant` and not `ignore`. Renames
# count on both sides. Schedules and releases therefore always run in full.
#
# Merge queue (krizaka-internal#4840): an entry whose tree is the very tree a green pull-request run of the same
# workflow already tested is not tested again: `code` is `false`, the heavy jobs report « Skipped » and every required
# check still reports on merge_group. That is the case of a pull request up to date with main, alone in its group (the
# queue's merge commit then has the pull request head's tree, which the pull-request run tested). The proof is: the
# pull request named by the queue branch (`gh-readonly-queue/<base>/pr-<n>-<sha>`), its head's tree equal to the
# entry's tree, and a run of this workflow (GITHUB_WORKFLOW_REF, the caller's file) on that head, event pull_request,
# concluded `success`. Anything else (main moved, several pull requests in the group, no green run, a cancelled or red
# run, an API error, a private repository whose token cannot list runs) falls back to the entry's file list, as before:
# any doubt runs everything. A caller whose queue proves more than its pull request sets `reuse-pr-run: false`.
# Security scans are not behind this gate (security-scan.yml, CodeQL): they keep running on every merge_group.
name: changes

on:
  workflow_call:
    inputs:
      relevant:
        description: "JavaScript RegExp: a changed file matching it needs the jobs (default: every file)."
        type: string
        required: false
        default: "."
      ignore:
        description: "JavaScript RegExp: a changed file matching it never needs the jobs (checked after `relevant`)."
        type: string
        required: false
        default: ""
      release-files:
        description: "JavaScript RegExp: on a pull request from a release branch (release-please--*, changeset-release/*), when every changed file matches, skip the heavy jobs. Any other branch is untouched (a dependency bump changes the same files and is tested); release-files is never used on merge_group."
        type: string
        required: false
        default: ""
      full-on-default-push:
        description: "A push to the repository's default branch runs in full (code=true), whatever files it touched. A caller with a SonarCloud analysis sets it: Sonar analyses main only through the jobs this gate guards, so a docs-only push would leave main's analysis stale (krizaka-internal#4309)."
        type: boolean
        required: false
        default: false
      reuse-pr-run:
        description: "Merge queue: when the entry's tree is the tree a green pull-request run of this workflow tested, skip the heavy jobs (code=false). Set false for a gate whose jobs the pull request does not run (krizaka-internal#4840)."
        type: boolean
        required: false
        default: true
    outputs:
      code:
        description: "'false' only when every changed file is irrelevant, or (merge queue) when a green pull-request run already tested the same tree; otherwise 'true'."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - id: gate
        env:
          API_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REUSE_PR_RUN: ${{ inputs.reuse-pr-run }}
          RELEVANT: ${{ inputs.relevant }}
          IGNORE: ${{ inputs.ignore }}
          RELEASE_FILES: ${{ inputs.release-files }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_ON_DEFAULT_PUSH: ${{ inputs.full-on-default-push }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module - <<'GATE'
          import { appendFileSync } from "node:fs";

          const env = process.env;
          const api = env.GITHUB_API_URL || "https://api.github.com";
          const repo = env.GITHUB_REPOSITORY;
          const done = (code, why) => {
            console.log(`code=${code} (${why})`);
            if (env.GITHUB_OUTPUT) appendFileSync(env.GITHUB_OUTPUT, `code=${code}\n`);
            process.exit(0);
          };

          async function get(path) {
            const res = await fetch(`${api}${path}`, {
              headers: { accept: "application/vnd.github+json", authorization: `Bearer ${env.API_TOKEN}`, "x-github-api-version": "2022-11-28" },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`${path}: ${res.status}`);
            return res.json();
          }

          // The merge queue: the run that already proved this very tree green on the pull request, or a reason why not.
          async function provenRun() {
            const pr = /\/pr-(\d+)-[0-9a-f]{40}$/.exec(env.MQ_HEAD_REF || "")?.[1];
            if (!pr) return { why: `no pull request in the queue branch ${env.MQ_HEAD_REF}` };
            const workflow = /^[^/]+\/[^/]+\/([^@]+)@/.exec(env.GITHUB_WORKFLOW_REF || "")?.[1];
            if (!workflow) return { why: "no workflow ref" };
            const head = (await get(`/repos/${repo}/pulls/${pr}`)).head.sha;
            const treeOf = async (sha) => (await get(`/repos/${repo}/git/commits/${sha}`)).tree.sha;
            const [queued, tested] = await Promise.all([treeOf(env.GITHUB_SHA), treeOf(head)]);
            if (!queued || queued !== tested) return { why: `the entry's tree ${queued} is not the tree of #${pr}'s head ${tested}` };
            const { workflow_runs: runs } = await get(`/repos/${repo}/actions/runs?head_sha=${head}&event=pull_request&status=success&per_page=100`);
            const green = runs.find((r) => r.path === workflow && r.head_sha === head && r.event === "pull_request" && r.conclusion === "success");
            if (!green) return { why: `no green ${workflow} run on #${pr}'s head ${head}` };
            return { run: green.html_url, why: `tree ${queued} already proved green on #${pr} by ${green.html_url}: the heavy jobs are not run again` };
          }

          try {
            const relevant = new RegExp(env.RELEVANT || ".");
            const ignore = env.IGNORE ? new RegExp(env.IGNORE) : null;
            let files;
            // Before the file list: the analysis of main must not depend on what the push touched.
            if (env.FULL_ON_DEFAULT_PUSH === "true" && env.EVENT === "push" && env.REF_TYPE === "branch" && env.DEFAULT_BRANCH && env.REF_NAME === env.DEFAULT_BRANCH) done("true", "a push to the default branch runs in full (its Sonar analysis)");
            if (env.GATE_TEST_FILES) {
              files = JSON.parse(env.GATE_TEST_FILES); // unit-test hook (tests/changes-gate.test.mjs)
            } else if (env.EVENT === "pull_request") {
              files = [];
              for (let page = 1; page <= 30; page++) {
                const batch = await get(`/repos/${repo}/pulls/${env.PR}/files?per_page=100&page=${page}`);
                for (const f of batch) files.push(f.filename, ...(f.previous_filename ? [f.previous_filename] : []));
                if (batch.length < 100) break;
                if (page === 30) done("true", "more than 3000 files");
              }
            } else if (env.EVENT === "merge_group" && env.MQ_BASE) {
              if (env.REUSE_PR_RUN !== "false") {
                const proof = await provenRun().catch((error) => ({ why: `proof failed: ${error.message}` }));
                if (proof.run) done("false", proof.why);
                console.log(`full queue run: ${proof.why}`);
              }
              // The merge queue's branch: what this entry adds on top of the base it was built on.
              const cmp = await get(`/repos/${repo}/compare/${env.MQ_BASE}...${env.GITHUB_SHA}?per_page=100`);
              if (cmp.total_commits > 250 || (cmp.files || []).length >= 100) done("true", "a large merge group: run everything");
              files = (cmp.files || []).flatMap((f) => [f.filename, ...(f.previous_filename ? [f.previous_filename] : [])]);
            } else if (env.EVENT === "push" && env.REF_TYPE === "branch" && env.BEFORE && !/^0+$/.test(env.BEFORE)) {
              const cmp = await get(`/repos/${repo}/compare/${env.BEFORE}...${env.GITHUB_SHA}?per_page=100`);
              if (cmp.total_commits > 250 || (cmp.files || []).length >= 100) done("true", "a large push: run everything");
              files = (cmp.files || []).flatMap((f) => [f.filename, ...(f.previous_filename ? [f.previous_filename] : [])]);
            } else {
              done("true", `${env.EVENT} runs in full`);
            }
            if (!files.length) done("true", "no changed file listed (empty commit?)");
            // Only a release branch (the same two as fix-needs-guard's skipBranches): a dependency bump changes these files too and needs its tests.
            if (env.RELEASE_FILES && env.EVENT === "pull_request" && /^(release-please--|changeset-release\/)/.test(env.HEAD_REF || "")) {
              const releaseRe = new RegExp(env.RELEASE_FILES);
              if (files.every((f) => releaseRe.test(f))) done("false", `${files.length} file(s) on a release branch, all match release-files: skip the heavy jobs`);
            }
            const needed = files.filter((f) => relevant.test(f) && !(ignore && ignore.test(f)));
            done(needed.length ? "true" : "false", needed.length ? `needs the jobs: ${needed.slice(0, 5).join(", ")}` : `${files.length} file(s), none relevant`);
          } catch (error) {
            done("true", `gate failed open: ${error.message}`);
          }
          GATE
