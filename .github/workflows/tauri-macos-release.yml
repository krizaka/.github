# The signed release of a Krizaka macOS app (Tauri 2, krizaka-desktop; ADR-005): check, then the signed and notarised .dmg
# in the `release` environment, which holds the secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8, APPLE_TEAM_ID). Only a push to main or a tag signs (gate); the .dmg is attached
# to the GitHub release only on a tag. Secrets are passed by name, never inherited. The pull-request path is tauri-macos.yml.
#
# Apart from tauri-macos.yml because only this job writes (krizaka-internal#4204): a called workflow cannot ask for more than its
# caller grants, even for a skipped job (startup_failure), so the write lives in the file only the release caller calls.
#
#   desktop-release:           # push of a tag: signed, secrets passed by name
#     if: github.event_name == 'push'
#     permissions: { contents: write }
#     uses: krizaka/.github/.github/workflows/tauri-macos-release.yml@<sha>
#     with: { working-directory: apps/desktop, product-name: "Verikora", tag-prefix: "v" }
#     secrets: { APPLE_CERTIFICATE: "${{ secrets.APPLE_CERTIFICATE }}", ... }

name: tauri-macos-release

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the app (it holds package.json and src-tauri)."
        type: string
        default: apps/desktop
      product-name:
        description: "The product's name, for the release title (`Verikora`)."
        type: string
        required: true
      tag-prefix:
        description: "The release tags start with this (`desktop-v`); the rest must match the app's version."
        type: string
        default: "desktop-v"
      node-version:
        type: string
        default: "22"
      check-script:
        description: "package.json script that runs every check (types, UI tests, Rust tests)."
        type: string
        default: check
      build-script:
        description: "package.json script that builds the .dmg (`tauri build --bundles dmg --target aarch64-apple-darwin`)."
        type: string
        default: "build:app"
      timeout-minutes:
        type: number
        default: 40
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_TEAM_ID:
        required: false


# The workflow level grants nothing; each job states its own (OpenSSF Scorecard Token-Permissions, krizaka-internal#4204).
permissions: {}

jobs:
  gate:
    name: signing only on main or a tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - name: Refuse to sign outside a push to main or a tag
        run: |
          [ "$EVENT" = "push" ] || { echo "sign: true is allowed on push only, not $EVENT"; exit 1; }
          case "$REF" in refs/heads/main|refs/tags/*) ;; *) echo "sign: true is allowed on main or a tag, not $REF"; exit 1;; esac

  check:
    name: desktop check
    runs-on: macos-15
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Types, UI tests, Rust tests
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: pnpm run "$SCRIPT"

  release:
    name: desktop dmg
    needs: [gate, check]
    environment: release
    permissions:
      contents: write # creates the GitHub release of the tag and attaches the signed .dmg
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PREFIX: ${{ inputs.tag-prefix }}
      PRODUCT: ${{ inputs.product-name }}
      BUILD: ${{ inputs.build-script }}
    steps:
      - name: Validate signing and notarisation credentials
        env:
          SIGNING_READY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          NOTARIZATION_READY: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          [ "$SIGNING_READY" = "true" ] || { echo "Developer ID signing credentials are required."; exit 1; }
          [ "$NOTARIZATION_READY" = "true" ] || { echo "App Store Connect notarisation credentials are required."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          v="${GITHUB_REF_NAME#"$PREFIX"}"
          app="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "${v%%-*}" = "$app" ] && [ "$app" = "$conf" ] || { echo "tag $v, package $app, tauri $conf must agree"; exit 1; }
      - name: Write the App Store Connect API key (notarisation)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key" >> "$GITHUB_ENV"
      - name: Build the signed and notarised .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run "$BUILD"
      - name: Checksum
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Attach to the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ inputs.working-directory }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; *) ;; esac
          notes="$PRODUCT for macOS (Apple Silicon)."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 $flags --title "$PRODUCT ${GITHUB_REF_NAME#"$PREFIX"}" --notes "$notes"
          fi
