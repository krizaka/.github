# The pipeline of every Krizaka JVM repository published to a Maven registry (com.krizaka; ADR-019).
#
# A repository's own .github/workflows/ci.yml calls it:
#
#   jobs:
#     maven:
#       uses: krizaka/.github/.github/workflows/maven.yml@main
#       with:
#         upstreams: "krizaka-build krizaka-platform-kit"   # repositories built first, in order
#         rewrite: true                                     # OpenRewrite dry run must find nothing to change
#         registry: github                                  # github | central (default) | "github,central"
#       secrets: inherit
#
# verify — on every push and pull request: the upstream Krizaka repositories are built from their
#   default branch, then this one is verified with the `release` profile and no signature: tests,
#   integration tests, formatting, AND the sources and javadoc jars Central requires. A javadoc
#   error is found the day it is written, not on release day.
#
# release — on a v* tag only, once per registry of the `registry` input (the registry is configuration, ADR-019):
#   the version is taken from the tag (v0.1.0 → 0.1.0) for this repository and for its Krizaka parent.
#   `github`: deployed unsigned to GitHub Packages (maven.pkg.github.com/<repository>) with the
#   workflow's GITHUB_TOKEN (`packages: write`), sources and javadoc jars included — no secret to keep.
#   `central`: every artifact is signed (OpenPGP, Bouncy Castle — no gpg binary) and uploaded to the Central Portal.
#   The parent POM keeps autoPublish=false, so the deployment is validated and then WAITS in central.sonatype.com for a
#   human to press Publish: a release on Central can never be deleted. Central validates a POM against its parent ON
#   CENTRAL: tag krizaka-build first and publish it before tagging the repositories that inherit krizaka-parent.
#   Switching the registry = this input + a release; both at once is allowed. `verify` dry-runs the GitHub deployment
#   (to a local folder) on every pull request, so the release path is exercised before release day.
#
# Reading: when `github` is selected, the Krizaka building blocks' packages are added to the runner's Maven settings
#   (the caller's `maven` job grants `packages: read`, and `packages: write` to release); each package grants read access to the repositories that use it (package settings).
#
# Organisation secrets it reads (never stored in a repository):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   Central Portal user token (server id `central`)
#   MAVEN_GPG_KEY                                     ASCII-armoured private signing key
#   MAVEN_GPG_PASSPHRASE                              its passphrase
name: maven

on:
  workflow_call:
    inputs:
      deploy-modules:
        description: "GitHub Packages deploy only: a comma-separated -pl list of the modules to deploy (republish of a release whose deploy stopped half way). Set, the 'Already published?' check is skipped (it looks at the root POM, already there) and only these modules are deployed. Empty: the whole reactor."
        required: false
        default: ""
        type: string
      deploy-repository:
        description: "GitHub Packages deploy only: the repository URL to deploy to (owner/name). A package is bound to the repository it was first published from, and any other repository gets HTTP 422 whatever the token: republish the modules of krizaka-platform-kit, krizaka-users or krizaka-notifications through their own repository. Empty: this repository."
        required: false
        default: ""
        type: string
      upstreams:
        description: "Krizaka repositories to build first, in order (space-separated)"
        required: false
        default: ""
        type: string
      java-version:
        description: "JDK used to build"
        required: false
        default: "21"
        type: string
      rewrite:
        description: "Fail when an OpenRewrite recipe of krizaka-parent would change code (rewrite:dryRun). A repository turns it on in the pull request that applies rewrite:run."
        required: false
        default: false
        type: boolean
      duplication:
        description: "Run the duplicate-code check (actions/dup-check: jscpd + the repository's dup-ratchet.json, which may only go down)."
        required: false
        default: false
        type: boolean
      threads:
        description: "Maven reactor threads for the verify step (-T, e.g. 2 or 1C) in a multi-module repository whose modules are independent; empty: serial."
        required: false
        default: ""
        type: string
      sonar:
        description: "Run the SonarCloud CI analysis after verify (jobs `sonar` / `sonar-light`) and report the always-present `gate`. Turn off the project's automatic analysis once it is green."
        required: false
        default: false
        type: boolean
      sonar-coverage-paths:
        description: "Newline-separated files verify uploads for the analysis (JaCoCo report and compiled classes). Globs allowed."
        required: false
        default: |
          **/target/site/jacoco/jacoco.xml
          **/target/classes
        type: string
      sonar-args:
        description: "Extra scanner arguments. Project settings belong in sonar-project.properties."
        required: false
        default: ""
        type: string
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the build."
        required: false
        default: '^\.changeset/|^(LICENSE|NOTICE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
        type: string

      registry:
        description: "Where a v* tag publishes: github (GitHub Packages), central (Maven Central, default until a repository moves), or both (\"github,central\"). ADR-019. `github` needs krizaka-parent with the registry-central profile."
        required: false
        default: "central"
        type: string

    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (the org secret). Required when `sonar` is true; never printed."
        required: false
      MAVEN_CENTRAL_USERNAME:
        description: "Central Portal user token (release only)."
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Central Portal user token password (release only)."
        required: false
      MAVEN_GPG_KEY:
        description: "ASCII-armoured signing key (release only)."
        required: false
      MAVEN_GPG_PASSPHRASE:
        description: "Its passphrase (release only)."
        required: false
      MAVEN_PUBLISH_TOKEN:
        description: "Optional token with write:packages used to deploy to GitHub Packages instead of GITHUB_TOKEN (packages first published by another repository refuse the GITHUB_TOKEN of this one, HTTP 422). Unset: GITHUB_TOKEN."
        required: false
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}

# No workflow-level `permissions:`: it would cap `release-github` at read (the 403 on the 0.3.0 deploy). Every job below
# but that one states `contents: read` itself; `release-github` takes what its caller grants.
jobs:
  # A change no build can read (licence, templates) skips `verify` (reported « Skipped », which passes branch protection).
  # Fail-open; a tag, a schedule and a dispatch run in full.
  changes:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@d701b569b15617609b890102bc0be9978759909c # main
    with:
      ignore: ${{ inputs.ignore }}

  verify:
    name: Verify (tests, javadoc, sources)
    needs: changes
    permissions:
      contents: read
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A typo in `registry` fails here, on the pull request, not on release day.
      - name: Registry
        id: registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          # registry-parse:begin
          registry="$(printf '%s' "$REGISTRY" | tr ',' ' ' | xargs)"
          github=false; central=false
          [ -n "$registry" ] || { echo "::error::registry is empty: use github, central, or a list of both"; exit 1; }
          for name in $registry; do
            case "$name" in
              github) github=true ;;
              central) central=true ;;
              *) echo "::error::unknown registry: $name (known: github, central)"; exit 1 ;;
            esac
          done
          { echo "github=$github"; echo "central=$central"; } >> "$GITHUB_OUTPUT"
          # registry-parse:end

      # The repository's folders stay clean (docs/standards/repo-layout.md).
      - uses: krizaka/.github/actions/repo-layout@d701b569b15617609b890102bc0be9978759909c # main

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Read the Krizaka building blocks from GitHub Packages
        if: steps.registry.outputs.github == 'true'
        uses: krizaka/.github/actions/maven-github-packages@d701b569b15617609b890102bc0be9978759909c # main
        with:
          token: ${{ github.token }}
          repositories: krizaka-build krizaka-platform-kit krizaka-users krizaka-notifications krizaka-billing

      - name: Build the upstream Krizaka repositories
        if: inputs.upstreams != ''
        env:
          UPSTREAMS: ${{ inputs.upstreams }}
        run: |
          for repository in $UPSTREAMS; do
            git clone --depth 1 "https://github.com/krizaka/${repository}.git" "../${repository}"
            # -DskipTests alone still runs the Failsafe integration tests (Testcontainers): an upstream is built to be installed.
            # NullAway (krizaka-parent profile krizaka-nullaway) checks the repository's own code in its own CI; an upstream
            # is only installed here, and its modules that declare their own annotationProcessorPaths cannot host Error Prone
            # ("plug-in not found: ErrorProne", seen on krizaka-security once krizaka-build#121 was on main).
            (cd "../${repository}" && ./mvnw -B -ntp install -DskipTests -DskipITs -Dkrizaka.nullaway.skip=true)
          done

      - name: Verify with the release profile, unsigned
        env:
          THREADS: ${{ inputs.threads }}
        run: |
          # shellcheck disable=SC2086  # -T and its value are word-split on purpose
          ./mvnw -B -ntp ${THREADS:+-T $THREADS} verify -Prelease -Dgpg.skip

      # The release path of `github`, run for real but into a folder: the deployment a tag would do.
      - name: Dry-run the GitHub Packages deployment
        if: steps.registry.outputs.github == 'true'
        run: ./mvnw -B -ntp deploy -Prelease -Dgpg.skip -DskipTests -DskipITs -Dkrizaka.quality.phase=none "-DaltDeploymentRepository=github::file://${RUNNER_TEMP}/registry-dry-run"

      # The recipes live in krizaka-parent (one place, every repository inherits them). A change a recipe
      # would make is debt: apply it with `./mvnw rewrite:run`, run the tests, commit.
      - name: OpenRewrite — no change pending
        if: inputs.rewrite
        run: ./mvnw -B -ntp rewrite:dryRun

      - name: Collect the coverage for SonarCloud
        if: ${{ inputs.sonar }}
        env:
          PATHS: ${{ inputs.sonar-coverage-paths }}
          OUT: ${{ runner.temp }}/sonar-coverage.tar
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2206  # the pattern is a glob on purpose
            matches=($pattern)
            files+=("${matches[@]}")
          done <<< "$PATHS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage report found ($PATHS): the analysis runs without coverage and the new-code coverage condition will fail"
            tar -cf "$OUT" --files-from /dev/null
          else
            tar -cf "$OUT" "${files[@]}"
            echo "collected: ${files[*]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.sonar }}
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage.tar
          retention-days: 1
          if-no-files-found: error

  duplication:
    name: Duplicate code
    needs: changes
    permissions:
      contents: read
    if: ${{ inputs.duplication && !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: krizaka/.github/actions/dup-check@d701b569b15617609b890102bc0be9978759909c # main

  # A docs-only change skips the heavy jobs, yet the required « SonarCloud Code Analysis » must still be posted by the SonarCloud app:
  # a light scan (checkout, no build, no tests, no coverage) does it, and its quality gate is real on the changed files (.github#330).
  # Never a synthetic status: that would forge a check which belongs to another app.
  sonar-light:
    name: SonarCloud (docs only)
    needs: changes
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          args: -Dsonar.projectVersion=ci-${{ github.run_number }} -Dsonar.qualitygate.wait=true -Dsonar.java.binaries=. ${{ inputs.sonar-args }}

  sonar:
    name: SonarCloud
    needs: [changes, verify]
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code != 'false' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage

      - name: Restore the reports
        env:
          TAR: ${{ runner.temp }}/sonar-coverage/sonar-coverage.tar
        run: tar -xf "$TAR"

      # CI analysis: the SonarCloud app still decorates the pull request and posts « SonarCloud Code Analysis »; the quality gate is awaited
      # here so the CI gate carries its verdict too.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          args: -Dsonar.projectVersion=ci-${{ github.run_number }} -Dsonar.qualitygate.wait=true ${{ inputs.sonar-args }}

  # ALWAYS reports (see java-ci.yml): green when verify succeeded or the changes gate legitimately skipped it; the merge queue
  # and branch protection can require this one name whatever the change.
  gate:
    name: CI gate
    needs: [changes, verify, sonar, sonar-light]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_WANTED: ${{ inputs.sonar }}
          SONAR_LIGHT: ${{ needs.sonar-light.result }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES verify=$VERIFY"
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the job ran in full"
          case "$VERIFY" in success|skipped) ;; *) echo "::error::verify $VERIFY"; fail=1 ;; esac
          case "${SONAR:-skipped}" in success|skipped) ;; *) echo "::error::sonar $SONAR"; fail=1 ;; esac
          if [ "$CODE" != "false" ] && [ "$VERIFY" != success ]; then
            echo "::error::verify must run when the gate did not answer false"; fail=1
          fi
          if [ "$CODE" != "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "$VERIFY" = success ] && [ "${SONAR:-skipped}" != success ]; then
            echo "::error::sonar must run and succeed when the gate did not answer false"; fail=1
          fi
          if [ "$CODE" = "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "${SONAR_LIGHT:-skipped}" != success ]; then
            echo "::error::sonar-light must run and succeed on a docs-only change"; fail=1
          fi
          case "${SONAR_LIGHT:-skipped}" in success|skipped) ;; *) echo "::error::sonar-light $SONAR_LIGHT"; fail=1 ;; esac
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| verify | $VERIFY |"
            echo "| sonar | ${SONAR:-skipped} |"
            echo "| sonar-light | ${SONAR_LIGHT:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

  # Parse once; the release jobs read it.
  registry:
    name: Registry
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      github: ${{ steps.parse.outputs.github }}
      central: ${{ steps.parse.outputs.central }}
    steps:
      - id: parse
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          # registry-parse:copy-begin
          registry="$(printf '%s' "$REGISTRY" | tr ',' ' ' | xargs)"
          github=false; central=false
          [ -n "$registry" ] || { echo "::error::registry is empty: use github, central, or a list of both"; exit 1; }
          for name in $registry; do
            case "$name" in
              github) github=true ;;
              central) central=true ;;
              *) echo "::error::unknown registry: $name (known: github, central)"; exit 1 ;;
            esac
          done
          { echo "github=$github"; echo "central=$central"; } >> "$GITHUB_OUTPUT"
          # registry-parse:copy-end

  release-github:
    name: Deploy to GitHub Packages
    needs: registry
    if: needs.registry.outputs.github == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A tag push and a workflow_dispatch can both reach this job for the same tag: one at a time per tag, so the second one finds
    # the version published and says so (step "Already published?") instead of failing 409 on a race.
    concurrency:
      group: release-github-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    # No `permissions:` on purpose (nor at the top of the file): a reusable workflow cannot ask for more than its caller grants, and asking for
    # `packages: write` here would stop every caller that stays on `central` (startup failure). A repository that
    # chooses `github` grants `packages: write` on its `maven` job (read is enough for pull requests).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: krizaka/.github/actions/maven-github-packages@d701b569b15617609b890102bc0be9978759909c # main
        with:
          token: ${{ github.token }}
          repositories: krizaka-build krizaka-platform-kit krizaka-users krizaka-notifications krizaka-billing

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          snapshot="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          # Every Krizaka JVM artifact is released at one version (krizaka-bom): the repository's own
          # modules and the krizaka-parent it inherits all carry the same SNAPSHOT, so one literal
          # substitution sets both. versions:set cannot: krizaka-build's root inherits its version
          # from one of its own modules and the plugin refuses it.
          find . -name pom.xml -not -path '*/target/*' -exec \
            sed -i "s|<version>${snapshot}</version>|<version>${version}</version>|g" {} +
          if grep -rq --include=pom.xml -e '-SNAPSHOT</version>' .; then
            echo "::error::a SNAPSHOT version is left after setting ${version}"; exit 1
          fi

      # A check, not a silent pass: the root POM of this version is looked up on the registry. Absent: deploy. Present with the
      # content of the POM built here: nothing to do, said in the log. Present with another checksum: fail (a published
      # version is never replaced; release a new one).
      - name: Already published?
        id: published
        if: inputs.deploy-modules == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          group="$(./mvnw -B -q -ntp -N help:evaluate -Dexpression=project.groupId -DforceStdout)"
          artifact="$(./mvnw -B -q -ntp -N help:evaluate -Dexpression=project.artifactId -DforceStdout)"
          url="https://maven.pkg.github.com/${REPOSITORY}/${group//./\/}/${artifact}/${version}/${artifact}-${version}.pom"
          code="$(curl -s -o "${RUNNER_TEMP}/remote.pom" -w '%{http_code}' -u "x-access-token:${GITHUB_TOKEN}" "${url}")"
          case "$code" in
            404) echo "published=false" >> "$GITHUB_OUTPUT"; echo "${artifact} ${version} is not on the registry yet: deploying" ;;
            200)
              remote="$(sha256sum "${RUNNER_TEMP}/remote.pom" | cut -c1-64)"
              local_sum="$(sha256sum pom.xml | cut -c1-64)"
              if [ "$remote" = "$local_sum" ]; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "already published, same checksum (${artifact} ${version}, sha256 ${local_sum}): nothing to deploy"
              else
                echo "::error::${artifact} ${version} is already published with another checksum (registry ${remote}, built here ${local_sum}); a published version is never replaced, release a new one"; exit 1
              fi ;;
            *) echo "::error::the registry answered HTTP ${code} for ${url}"; exit 1 ;;
          esac

      # Sources and javadoc jars (profile release), no signature, no Central plugin (profile registry-central). Tests ran in `verify` on this commit.
      - name: Deploy
        if: steps.published.outputs.published != 'true'
        env:
          DEPLOY_MODULES: ${{ inputs.deploy-modules }}
          DEPLOY_REPOSITORY: ${{ inputs.deploy-repository }}
          # The settings.xml written by setup-java reads this variable as the server password.
          GITHUB_TOKEN: ${{ secrets.MAVEN_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: ./mvnw -B -ntp ${DEPLOY_MODULES:+-pl "$DEPLOY_MODULES"} deploy -Prelease -Dgpg.skip -DskipTests -DskipITs -Dkrizaka.quality.phase=none "-DaltDeploymentRepository=github::https://maven.pkg.github.com/${DEPLOY_REPOSITORY:-$REPOSITORY}"

  release-central:
    name: Sign and upload to Maven Central
    needs: registry
    permissions:
      contents: read
    if: needs.registry.outputs.central == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          snapshot="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          # Every Krizaka JVM artifact is released at one version (krizaka-bom): the repository's own
          # modules and the krizaka-parent it inherits all carry the same SNAPSHOT, so one literal
          # substitution sets both. versions:set cannot: krizaka-build's root inherits its version
          # from one of its own modules and the plugin refuses it.
          find . -name pom.xml -not -path '*/target/*' -exec \
            sed -i "s|<version>${snapshot}</version>|<version>${version}</version>|g" {} +
          if grep -rq --include=pom.xml -e '-SNAPSHOT</version>' .; then
            echo "::error::a SNAPSHOT version is left after setting ${version}"; exit 1
          fi

      - name: Sign and upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp deploy -Prelease,registry-central -DskipTests -DskipITs
