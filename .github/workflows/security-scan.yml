# Security scan, org-wide (reusable; krizaka/.github#324 and #325, ADR-013): gitleaks (secrets in the whole history of the
# pull request's checkout, central config .gitleaks.toml) and zizmor (GitHub Actions vulnerabilities: script injection,
# unpinned or over-privileged steps). A repository calls it from a thin workflow:
#
#   jobs:
#     security:
#       uses: krizaka/.github/.github/workflows/security-scan.yml@<sha> # main
#       permissions: { contents: read }
#
# The same checks run earlier on the developer's machine through the pre-commit hooks (.pre-commit-hooks.yaml).
name: Security scan

on:
  workflow_call:
    inputs:
      guards-ref:
        description: Revision of krizaka/.github whose config and tool pins are used (main, except for this repository's own pull requests).
        type: string
        default: main
      runs-on:
        description: 'Runner of the scan jobs, as JSON (a private repository: ["self-hosted","macOS","krizaka"], krizaka-internal#3027). Default: the GitHub-hosted runner. A public repository never sets it: a fork pull request would run on the self-hosted machine.'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

# A newer push to the same pull request replaces the running scan (the scan is a pure function of the checkout). The group is
# per repository and pull request; the merge queue and main pushes are never cancelled. (org CI throughput, 2026-10-30)
concurrency:
  group: security-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    # Skipped in the merge queue (reports « Skipped », which counts as passing): the pull request's own run scanned the same
    # history and workflows, and a merge cannot introduce a secret that neither side had.
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The central configuration, and tool pins, from krizaka/.github main (public, our own).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/.github
          ref: ${{ inputs.guards-ref }}
          path: .krizaka-guards
          persist-credentials: false
      - uses: ./.krizaka-guards/actions/security-tools
      - name: Scan (values are redacted; the repository's own .gitleaks.toml is never read)
        run: gitleaks git --redact --no-banner -v --config .krizaka-guards/actions/security-tools/gitleaks.toml .

  # Every author, committer and co-author trailer is an identity of scripts/commit-identities.json (founder 2026-11-04: no e-mail can be invented).
  # On a pull request: its own commits. In the merge queue: the squash commit itself, so a squash message cannot add one.
  trailers:
    name: commit trailers
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/.github
          ref: ${{ inputs.guards-ref }}
          path: .krizaka-guards
          persist-credentials: false
      - name: Author, committer and co-authors are in the allow-list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            node .krizaka-guards/scripts/check-trailers.mjs --squash "$BASE" "$HEAD"
          else
            node .krizaka-guards/scripts/check-trailers.mjs "$BASE" "$HEAD"
          fi
      - name: No workflow or script writes a trailer outside the allow-list
        run: node .krizaka-guards/scripts/check-trailers.mjs --sources .github scripts tools

  zizmor:
    name: zizmor (workflows)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    # Skipped in the merge queue (reports « Skipped », which counts as passing): the pull request's own run scanned the same
    # history and workflows, and a merge cannot introduce a secret that neither side had.
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/.github
          ref: ${{ inputs.guards-ref }}
          path: .krizaka-guards
          persist-credentials: false
      - uses: ./.krizaka-guards/actions/security-tools
      - name: zizmor (pinned; the guards checkout is removed first, it is not part of the repository)
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp .krizaka-guards/actions/security-tools/zizmor.yml "$RUNNER_TEMP/zizmor.yml"
          rm -rf .krizaka-guards
          # Online: the token lets zizmor ask GitHub about known vulnerable actions, impostor commits and ref confusion.
          zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity medium --no-progress .
