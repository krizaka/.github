# The CI of a Krizaka macOS app (Tauri 2, krizaka-desktop; ADR-005): check and unsigned app build, no secret. Reusable: a
# product's .github/workflows/desktop.yml calls it on a pull request, and calls tauri-macos-release.yml for the signed .dmg:
#
#   on: { pull_request: { paths: ["apps/desktop/**"] }, push: { tags: ["v*"] } }
#   jobs:
#     desktop-pr:                # pull_request: unsigned, no secret
#       if: github.event_name == 'pull_request'
#       uses: krizaka/.github/.github/workflows/tauri-macos.yml@<sha>
#       with: { working-directory: apps/desktop, product-name: "Verikora", sign: false }
#     desktop-release:           # push of a tag: signed, secrets passed by name
#       if: github.event_name == 'push'
#       permissions: { contents: write }
#       uses: krizaka/.github/.github/workflows/tauri-macos-release.yml@<sha>
#       with: { working-directory: apps/desktop, product-name: "Verikora", tag-prefix: "v" }
#       secrets: { APPLE_CERTIFICATE: "${{ secrets.APPLE_CERTIFICATE }}", ... }
#
# `sign` stays for the callers that pass `sign: false`; `sign: true` is refused (the guard): signing moved to
# tauri-macos-release.yml (krizaka-internal#4204), the only file whose job writes. A signing secret passed here fails too.

name: tauri-macos

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the app (it holds package.json and src-tauri)."
        type: string
        default: apps/desktop
      product-name:
        description: "The product's name, for the release title (`Verikora`)."
        type: string
        required: true
      tag-prefix:
        description: "The release tags start with this (`desktop-v`); the rest must match the app's version."
        type: string
        default: "desktop-v"
      node-version:
        type: string
        default: "22"
      check-script:
        description: "package.json script that runs every check (types, UI tests, Rust tests)."
        type: string
        default: check
      build-script:
        description: "package.json script that builds the .dmg (`tauri build --bundles dmg --target aarch64-apple-darwin`)."
        type: string
        default: "build:app"
      timeout-minutes:
        type: number
        default: 40
      sign:
        description: "Must stay false: the signed .dmg moved to tauri-macos-release.yml (krizaka-internal#4204); true is refused."
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_TEAM_ID:
        required: false


# The workflow level grants nothing; each job states its own, none writes, so a pull-request caller that grants
# `contents: read` starts every job (OpenSSF Scorecard Token-Permissions, krizaka-internal#4204).
permissions: {}

jobs:
  guard:
    name: no secret on a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      SIGN: ${{ inputs.sign }}
      HAS_SECRET: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_CERTIFICATE_PASSWORD != '' || secrets.APPLE_SIGNING_IDENTITY != '' || secrets.APPLE_API_ISSUER != '' || secrets.APPLE_API_KEY != '' || secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Refuse sign true, moved to tauri-macos-release.yml
        run: |
          if [ "$SIGN" = "true" ]; then
            echo "sign: true moved to tauri-macos-release.yml (krizaka-internal#4204): call it from the release job."
            exit 1
          fi
      - name: Refuse a signing secret in unsigned mode
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "A signing secret was passed with sign: false. Pass no secret on pull_request."
            exit 1
          fi

  check:
    name: desktop check
    runs-on: macos-15
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Types, UI tests, Rust tests
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: pnpm run "$SCRIPT"

  build-unsigned:
    name: desktop unsigned app build
    if: ${{ !inputs.sign }}
    needs: [guard, check]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      BUILD: ${{ inputs.build-script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned app
        run: pnpm run "$BUILD"
