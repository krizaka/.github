# « Docs are current » (krizaka/.github#351): the fact blocks of docs/standards/*.md (between `<!-- gen:<name>:start -->` and
# `<!-- gen:<name>:end -->`) are written by scripts/gen-docs.mjs from their sources, never by hand.
#
#   check    on every pull request (called by ci-gate.yml): the blocks read from this repository (the shared workflows,
#            guard-paths.json) are regenerated and must not differ. On a pull request from a branch of this repository the
#            CI regenerates them itself and pushes ONE commit `chore: regenerate` with the Krizaka Agents app's token (so the
#            checks run again on it), instead of failing (rules review of 2026-11-05). In the merge queue, on main or from a
#            fork nothing can be pushed: it fails. Fix by hand: `node scripts/gen-docs.mjs`, commit.
#   refresh  weekly and on demand: the blocks read from outside (rulesets and branch protection of the org's repositories, npm)
#            are regenerated with `--remote`; when one changed, ONE pull request `chore/docs-current` is opened or updated,
#            with the token of the Krizaka Agents app (as app-videos.yml) so that its checks run.
name: Docs are current

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # Called by ci-gate.yml on every pull request (which suites apply is decided there, by scripts/ci-scope.mjs).
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "The Krizaka Agents app's private key: pushes the `chore: regenerate` commit on a pull request's branch."
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Docs are current
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pull request's head (not the merge commit), so a regeneration commits on the branch. No credential in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Rules review of 2026-11-05: the generators regenerate themselves. Only on a pull request from a branch of this repository.
      - id: regen
        name: Regenerate the blocks
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node scripts/gen-docs.mjs
          if git diff --quiet -- docs; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(git log -1 --format=%s)" = "chore: regenerate" ]; then
            echo "::error::The blocks differ again right after a \`chore: regenerate\` commit: the generator is not stable. Fix it by hand."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Minted after the generator ran, so the pull request's code never sees it. Absent (no key, Dependabot): the check below fails as before.
      - id: app
        if: ${{ steps.regen.outputs.changed == 'true' && vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the regenerated blocks on the branch
        if: ${{ steps.regen.outputs.changed == 'true' && steps.app.outputs.token != '' }}
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "krizaka-agents[bot]"
          git config user.email "345578919+krizaka-agents[bot]@users.noreply.github.com"
          git add docs
          git commit -q -m "chore: regenerate"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$REPO.git" "HEAD:refs/heads/$HEAD_REF"
          echo "::notice title=Docs are current::The generated blocks were out of date: \`chore: regenerate\` was pushed on $HEAD_REF; the checks run again on it."
      - run: node --test --test-timeout=120000 --test-force-exit tests/gen-docs.test.mjs
      - run: node scripts/gen-docs.mjs --check

  refresh:
    name: Refresh the blocks read from GitHub and npm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] reads the rulesets of every repository of the org (permission-administration: read); writes only on this one, by the pull request below
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
      # The pull request must be pushed with the app's token (the default token starts no workflow on it): the credential stays in
      # the checkout for the push below, in this short-lived job only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it; no artifact is uploaded
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regenerate, then open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: chore/docs-current
        run: |
          node scripts/gen-docs.mjs --remote
          if git diff --quiet -- docs; then echo "docs are current"; exit 0; fi
          git config user.name "krizaka-agents[bot]"
          git config user.email "345578919+krizaka-agents[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs
          git commit -m "docs(standards): refresh the generated blocks (required checks, queue state, versions)"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "docs(standards): refresh the generated blocks" \
              --body "Regenerated by \`node scripts/gen-docs.mjs --remote\` (docs-current.yml): the rulesets, branch protection and npm versions changed. Never hand-edit a \`gen\` block."
          fi
