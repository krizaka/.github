# The org profile's check on a pull request: its tests, and the generated block's markers.
# Called by ci-gate.yml (profile.yml keeps the weekly regeneration, which needs write permissions a caller must not be asked for).
name: profile-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test --test-timeout=120000 --test-force-exit tests/*.test.mjs
      - name: The code-quality table is the generated one
        run: node scripts/profile-quality.mjs --check
      # The generated block is read from the registries and the health checks (it changes by itself), so a pull request does not
      # compare it: profile.yml regenerates it every day. Here its markers and its own tests are what must hold.
      - name: The generated block keeps its markers
        run: grep -q 'generated:start' profile/README.md && grep -q 'generated:end' profile/README.md
