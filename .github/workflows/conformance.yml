# The conformance matrix (krizaka/.github#393): every rule of docs/standards/rules.json against every active repository.
# Daily (krizaka-internal#883), on a pull request that adds or changes a rule (a rule without its check fails), and by hand. The pull
# request run validates the registry and prints the matrix; the daily run reads main of every repository with the agents' app,
# publishes the matrix on the branch conformance-matrix (conformance/matrix.md, .json), opens one issue per repository red on a
# security rule and fails while a security cell is red. Rules review of 2026-11-05: the same-day rollout holds only for the rules
# marked `"security": true`; the other rules are reported in the matrix, never fanned out (and the registry is frozen at 35 rules).
name: Conformance

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - docs/standards/rules.json
      - scripts/conformance*.mjs
      - tests/conformance*.test.mjs
      - workflow-templates/**
      - AGENTS.template.md
      - repos.json
      - docs/architecture/**
      - tools/architecture/**
      - .github/workflows/conformance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Conformance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The registry is valid and its tests pass
        run: |
          node scripts/conformance.mjs --validate
          node --test tests/conformance.test.mjs tests/conformance-versions.test.mjs tests/conformance-fanout.test.mjs tests/conformance-issues.test.mjs tests/red-run-issue.test.mjs
      - id: repos
        run: echo "list=$(node scripts/conformance.mjs --repo-list)" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          # The issues live in krizaka-internal (conformance-issues.mjs INTERNAL): without it the issue step answers 404.
          repositories: ${{ steps.repos.outputs.list }},krizaka-internal
          permission-contents: read
          permission-administration: read
          permission-metadata: read
          permission-issues: write
      # The architecture (ADR-027, krizaka-internal#2809): every active repository at its default branch, its current state
      # (@krizaka/architecture), the hand-written models read with the org base, the drift and one verdict per repository. Before the
      # matrix, which reads those verdicts; a failure here never stops the matrix (its cells are then unknown, never green).
      - name: The architecture's dependencies
        working-directory: tools/architecture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The architecture
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node tools/architecture/architecture.mjs --out architecture
          { echo '### Architecture'; cat architecture/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: The matrix
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fail=()
          if [ "$EVENT" = schedule ]; then fail=(--fail); fi
          set +e
          node scripts/conformance.mjs --json matrix.json "${fail[@]}" | tee matrix.md
          status=${PIPESTATUS[0]}
          { echo '### Conformance matrix'; cat matrix.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Daily (and by hand): the matrix is published where the founder and the cockpit read it. A token of its own: contents
      # write on krizaka/.github only, to the data branch conformance-matrix (never main).
      - id: publish
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: .github
          permission-contents: write
      - name: Publish the matrix
        if: ${{ always() && github.event_name != 'pull_request' && steps.publish.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.publish.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/conformance-publish.mjs matrix.md matrix.json
      - name: Publish the architecture
        if: ${{ always() && github.event_name != 'pull_request' && steps.publish.outputs.token != '' && hashFiles('architecture/architecture.json') != '' }}
        env:
          GH_TOKEN: ${{ steps.publish.outputs.token }}
        run: node tools/architecture/architecture.mjs --publish-from architecture
      # Daily (and by hand): one issue per red repository, refreshed while red, closed when green. Never on a pull request.
      - name: One issue per red repository
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/conformance-issues.mjs --matrix matrix.json --apply
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-matrix
          path: matrix.json
          retention-days: 14

  # Daily (and by hand), beside the matrix and independent of it (a red security cell never stops the catalogue): the automation
  # catalogue of ADR-026 (krizaka-internal#2755), generated from the files of every active repository at its default branch. Two
  # requests per repository (the commit, one tarball) plus one for the last workflow runs, then published next to the matrix on
  # the branch conformance-matrix (automation/catalogue.json, catalogue.md, history.json). Never on a pull request.
  catalogue:
    name: Automation catalogue
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/automation-catalogue
      - id: repos
        run: echo "list=$(node scripts/conformance.mjs --repo-list)" >> "$GITHUB_OUTPUT"
      - id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read
          permission-actions: read
          permission-metadata: read
      - id: publish
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: .github
          permission-contents: write
      - name: The catalogue
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
          GH_TOKEN: ${{ steps.publish.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Read the repositories with the read-only token, then publish with the write one (contents of this repository only).
          GH_TOKEN="$READ_TOKEN" node tools/automation-catalogue/catalogue.mjs --out catalogue --previous
          { echo '### Automation catalogue'; cat catalogue/catalogue.md; } >> "$GITHUB_STEP_SUMMARY"
          node tools/automation-catalogue/catalogue.mjs --publish-from catalogue
