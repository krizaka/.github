# The org profile (profile/README.md) is kept current by CI: every day, on every product release (`product-release`, sent by
# release-notes.yml) and on demand, scripts/profile-readme.mjs rewrites the block between `generated:start` and `generated:end`
# (the products under their commercial names, the @krizaka/* versions each one uses against the latest, the dev and prod
# environments read from their /api/healthz, the open stack's latest versions). It opens or updates ONE pull request.
# The pull request is opened with the GitHub App token, never GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN never starts
# its required checks (krizaka-internal#2158). The App needs Contents, Pull requests and Packages (read) on the org: the Java
# versions come from GitHub Packages. By hand: `gh workflow run profile.yml -R krizaka/.github`.
# Pull requests that touch the generator run profile-check.yml, called by ci-gate.yml. Actions are pinned by commit SHA (Dependabot keeps them current).
name: Org profile

on:
  repository_dispatch:
    types: [product-release]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka # zizmor: ignore[github-app] the generator reads the product repositories and GitHub Packages of the whole org
          permission-contents: write
          permission-pull-requests: write
          permission-packages: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the job pushes the regenerated branch with the App token
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test --test-timeout=120000 --test-force-exit tests/profile-readme.test.mjs tests/profile-quality.test.mjs
      - name: Every repository of the quality table exists, is not archived and has a Sonar project
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/profile-quality.mjs --verify
      - name: Read the registries and the health checks, rewrite the generated block
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/profile-readme.mjs
      - name: Open or update the one pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet -- profile/README.md; then echo "Profile already up to date."; exit 0; fi
          branch="chore/org-profile-sync"
          title="chore(profile): the org profile regenerated from the registries and the health checks"
          body="Regenerated by \`scripts/profile-readme.mjs\` (data: \`profile/products.json\`). Only the block between \`generated:start\` and \`generated:end\` changed: versions used and latest, the dev and prod health. Nothing here is typed by hand."
          git config user.name "krizaka-release[bot]"
          git config user.email "krizaka-release[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add profile/README.md
          git commit -m "$title"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
          fi
          gh pr merge "$branch" --auto --squash || echo "auto-merge not enabled (the repository decides)"
