# code-health (ADR-015, krizaka/.github#384): the measuring tool's own tests — TypeScript (ESLint type-aware) and Java
# (PMD 7 + javaparser) on fixtures whose findings are known. The measure itself runs against the checkouts, by hand or
# from the checkpoint; this workflow only proves the tool still counts right.
name: Code health

on:
  pull_request:
    paths:
      - tools/code-health/**
      - .github/workflows/code-health.yml
  push:
    branches: [main]
    paths:
      - tools/code-health/**
      - .github/workflows/code-health.yml

permissions:
  contents: read

jobs:
  test:
    name: Code health tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/code-health
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
