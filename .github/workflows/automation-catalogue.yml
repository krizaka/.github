# The automation catalogue's own tests (ADR-026, krizaka-internal#2755): fixtures whose units, callers, regexes and copies are
# known. The catalogue itself is generated daily by the Conformance workflow (job « Automation catalogue »); this workflow only
# proves the generator still counts right before a change to it merges.
name: Automation catalogue

on:
  # Called by ci-gate.yml (suite `catalogue`) on every pull request that touches the catalogue: a bump that breaks it (TypeScript 7
  # has no JS compiler API, krizaka-internal#3216) is red before merge. The gate is the required check, so it reports in the queue.
  workflow_call:
  push:
    branches: [main]
    paths:
      - tools/automation-catalogue/**
      - .github/workflows/automation-catalogue.yml

permissions:
  contents: read

jobs:
  test:
    name: Automation catalogue tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/automation-catalogue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
