# Weekly: does every repository get its checks back within its speed budget? (ADR-018). Report only, in the job summary;
# the repository health scorecard reads the same numbers (ADR-018, slice 2).
name: CI speed report

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: org-ci-speed
  cancel-in-progress: true

jobs:
  report:
    name: CI speed report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci-speed.mjs --json > ci-speed.json
          node scripts/ci-speed.mjs --from ci-speed.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-speed
          path: ci-speed.json
          retention-days: 30
