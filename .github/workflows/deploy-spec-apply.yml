# The CI door that applies a merged App Platform spec to its dev app (krizaka-internal#3879). Before it, a spec change merged in a
# product repository reached the live app only through an operator's `krizaka-deploy deploy --apply` with a write token: verikora-dev
# missed MEDIA_DOCUMENTS_TENANT for 22 h and refused 11 deployments (krizaka-internal#3878). Now:
#   1. the target comes from deploy/apps.json on main of this repository: the app, its repository, its spec file; an app the registry
#      does not list, or lists for krizaka-prod, is refused (production is out of scope);
#   2. `krizaka-deploy deploy --apply --dry-run` prints what the apply changes, by key and field — never a value;
#   3. `krizaka-deploy deploy --apply` sends the merged spec (the live encrypted secrets are kept, a variable the file drops or a plain
#      value it changes is refused), rebuilds main, waits for ACTIVE and checks that the head of main is what runs, then the live site.
#
# It runs here, not in the caller: the write token is the secret DIGITALOCEAN_ACCESS_TOKEN of the `dev` environment of krizaka/.github,
# which deploys from protected branches only (a reusable workflow's `environment:` would resolve in the caller, which has no such token).
# A product repository dispatches it on a push to main that changes its spec (the caller workflow deploy-spec-apply.yml there):
#   gh workflow run deploy-spec-apply.yml -R krizaka/.github --ref main -f app=verikora-dev
# `only` (e.g. services/web) applies some components of the file and keeps the others as they run: a component the file adds but that
# waits for a founder step does not hold back a fix of the web service.
# The dry run and the apply (only) get KRIZAKA_SECRET_BACKUP_AGE_RECIPIENT, the PUBLIC age recipient of verikora-dev's backup jobs; the
# CLI resolves `__BACKUP_AGE_RECIPIENT__` from it and refuses the file when it is missing. The private identity is never in CI.
# The daily drift report (deploy-watch, job `drift`) names this command for every drifting dev app.
name: deploy-spec-apply

on:
  workflow_dispatch:
    inputs:
      app:
        description: "The dev app to apply (its name in deploy/apps.json, e.g. verikora-dev)."
        required: true
        type: string
      dry-run:
        description: "Only print what the apply would change."
        type: boolean
        default: false
      only:
        description: "Apply only these components of the file (section/name, comma-separated, e.g. services/web); the others stay as they run."
        type: string
        default: ""
      share-secret:
        description: "Secrets (KEY, comma-separated) a component takes from the live value of the same key in another component (a job that needs the web's database URL)."
        type: string
        default: ""

permissions: {}

concurrency:
  group: deploy-spec-apply-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the merged spec of ${{ inputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
    env:
      APP: ${{ inputs.app }}
      ONLY: ${{ inputs.only }}
      SHARE: ${{ inputs.share-secret }}
    steps:
      - name: Is the DigitalOcean token set?
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
            echo "::error title=deploy-spec-apply::the secret DIGITALOCEAN_ACCESS_TOKEN of the dev environment is not set; no spec can be applied"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
          persist-credentials: false
          path: tools

      # The registry decides which repository and which spec; the input only names the app (the CLI checks it again with --app).
      - name: Which repository holds the spec?
        id: target
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "::error title=deploy-spec-apply::'$APP' is not an app name"
            exit 1
          fi
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[a-z_]+/[a-z0-9-]+(,[a-z_]+/[a-z0-9-]+)*$ ]]; then
            echo "::error title=deploy-spec-apply::'$ONLY' is not a list of section/name"
            exit 1
          fi
          if [ -n "$SHARE" ] && ! [[ "$SHARE" =~ ^[A-Z][A-Z0-9_]*(,[A-Z][A-Z0-9_]*)*$ ]]; then
            echo "::error title=deploy-spec-apply::'$SHARE' is not a list of secret names"
            exit 1
          fi
          repo=$(jq -r --arg app "$APP" '.apps[] | select(.app == $app and (.team // "Krizaka-team") == "Krizaka-team") | .repo' tools/deploy/apps.json)
          if [ -z "$repo" ]; then
            echo "::error title=deploy-spec-apply::$APP is not a Krizaka-team app of deploy/apps.json: refused"
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: main
          persist-credentials: false
          path: product

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          # "latest" resolved to v1.98.1 on the runner, whose spec parser refuses `schedule` (verikora-dev's scheduled backup jobs):
          # pinned to the release the operators run (krizaka-internal#3899).
          version: "1.179.0"

      - name: Install the CLI
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix tools/deploy

      # Reads only: the team, the app, the live spec, the merge, the schema validation and the live site. Writes nothing.
      - name: Dry run (what the apply changes)
        env:
          KRIZAKA_SECRET_BACKUP_AGE_RECIPIENT: ${{ secrets.KRIZAKA_SECRET_BACKUP_AGE_RECIPIENT }}
        run: |
          only=(); [ -n "$ONLY" ] && only=(--only "$ONLY")
          [ -n "$SHARE" ] && only+=(--share-secret "$SHARE")
          node tools/deploy/bin/krizaka-deploy.mjs deploy --config product/.krizaka-deploy.json --app "$APP" --apply --dry-run "${only[@]}"

      - name: Apply, rebuild main, wait for ACTIVE
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KRIZAKA_SECRET_BACKUP_AGE_RECIPIENT: ${{ secrets.KRIZAKA_SECRET_BACKUP_AGE_RECIPIENT }}
        run: |
          sha=$(git -C product rev-parse HEAD)
          only=(); [ -n "$ONLY" ] && only=(--only "$ONLY")
          [ -n "$SHARE" ] && only+=(--share-secret "$SHARE")
          node tools/deploy/bin/krizaka-deploy.mjs deploy --config product/.krizaka-deploy.json --app "$APP" --apply --expect-sha "$sha" "${only[@]}"
