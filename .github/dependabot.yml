# Dependabot — the Krizaka model (monthly, quiet; DEPS 2026-10-13). This file is the template for every repository.
# Once a month (the 1st, 06:00 Paris), ONE grouped pull request per ecosystem, at most one open per ecosystem.
# Security fixes stay on and arrive grouped apart. It also keeps the supply-chain pins fresh (actions by SHA, images by
# digest): docs/standards/supply-chain.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1

  # krizaka-deploy's one runtime dependency (the YAML parser), locked in deploy/package-lock.json.
  - package-ecosystem: npm
    directory: /deploy
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1

  # The automation catalogue's two runtime dependencies (the TypeScript compiler and the YAML parser), locked in its package-lock.json.
  - package-ecosystem: npm
    directory: /tools/automation-catalogue
    # TypeScript 7 is the native rewrite and ships no JavaScript compiler API (createSourceFile, ScriptKind), which the catalogue
    # uses (krizaka-internal#3216). Lift this when the catalogue moves to an API TypeScript 7 offers.
    ignore:
      - dependency-name: typescript
        versions: [">= 7"]
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
